cat > pyproject.toml << 'EOF'
[project]
name = "my-app"
version = "0.1.0"
description = "Your app description"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "tzlocal>=5.2"
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]
EOF
